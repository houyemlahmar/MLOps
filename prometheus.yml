# Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'diabetes-prediction-monitor'

# Scrape configurations
scrape_configs:
  # Scrape Flask API metrics
  - job_name: 'diabetes-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:5002']
        labels:
          service: 'diabetes-prediction-api'
          environment: 'production'

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alerting rules (optional)
# rule_files:
#   - 'alert_rules.yml'
