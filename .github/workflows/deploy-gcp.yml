name: Deploy to GCP Cloud Run

on:
  workflow_dispatch:  # Manual trigger only
  # workflow_run:
  #   workflows: ["Docker Build & Push"]
  #   types:
  #     - completed

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  SERVICE_NAME: diabetes-prediction-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/diabetes-prediction/api:latest \
          --platform=managed \
          --region=${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --port=5002 \
          --memory=2Gi \
          --cpu=2 \
          --min-instances=0 \
          --max-instances=10 \
          --timeout=300 \
          --set-env-vars="FLASK_HOST=0.0.0.0,FLASK_PORT=5002,FLASK_DEBUG=false" \
          --labels=app=diabetes-prediction,env=production,managed-by=github-actions
    
    - name: Get service URL
      id: service-url
      run: |
        SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --region=${{ env.GCP_REGION }} \
          --format='value(status.url)')
        echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
        echo "Deployment URL: $SERVICE_URL"
    
    - name: Test deployed service
      run: |
        SERVICE_URL="${{ steps.service-url.outputs.url }}"
        
        # Health check
        echo "Testing health endpoint..."
        curl -f "$SERVICE_URL/health" || exit 1
        
        # Info endpoint
        echo "Testing info endpoint..."
        curl -f "$SERVICE_URL/info" || exit 1
        
        echo "✅ Deployment verification successful"
    
    - name: Create deployment summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Service Name:** ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Region:** ${{ env.GCP_REGION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **URL:** ${{ steps.service-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployed at:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Quick Links" >> $GITHUB_STEP_SUMMARY
        echo "- [Health Check](${{ steps.service-url.outputs.url }}/health)" >> $GITHUB_STEP_SUMMARY
        echo "- [API Info](${{ steps.service-url.outputs.url }}/info)" >> $GITHUB_STEP_SUMMARY
        echo "- [Web UI](${{ steps.service-url.outputs.url }})" >> $GITHUB_STEP_SUMMARY
    
    - name: Send Slack notification
      if: vars.SLACK_WEBHOOK_URL != ''
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {
            "text": "🚀 Deployed to GCP Cloud Run",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deployment Successful* 🚀\n*Service:* ${{ env.SERVICE_NAME }}\n*Region:* ${{ env.GCP_REGION }}\n*URL:* ${{ steps.service-url.outputs.url }}"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "Open Web UI"
                    },
                    "url": "${{ steps.service-url.outputs.url }}"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Logs"
                    },
                    "url": "https://console.cloud.google.com/run/detail/${{ env.GCP_REGION }}/${{ env.SERVICE_NAME }}/logs"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
      continue-on-error: true
    
    - name: Notify on failure
      if: failure() && vars.SLACK_WEBHOOK_URL != ''
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {
            "text": "❌ GCP Deployment Failed",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deployment Failed* ❌\n*Service:* ${{ env.SERVICE_NAME }}\n*Region:* ${{ env.GCP_REGION }}\n*Workflow:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
      continue-on-error: true
