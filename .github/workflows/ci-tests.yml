name: CI - Tests & Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.13'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run API tests
      run: |
        # Start the API server in background
        python src/serve.py &
        sleep 10
        # Run tests
        python tests/test_api.py
    
    - name: Generate coverage report
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  data-validation:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Validate data schema
      run: |
        pip install pandas
        python -c "
        import pandas as pd
        import sys
        
        # Load data
        df = pd.read_csv('data/raw/diabetes.csv')
        
        # Validate schema
        required_columns = ['age', 'bmi', 'HbA1c_level', 'blood_glucose_level', 
                           'hypertension', 'heart_disease', 'gender', 
                           'smoking_history', 'diabetes']
        
        missing_cols = set(required_columns) - set(df.columns)
        if missing_cols:
            print(f'❌ Error: Missing columns: {missing_cols}')
            sys.exit(1)
        
        print('✅ Data schema validated')
        print(f'✅ Dataset shape: {df.shape}')
        print(f'✅ Memory usage: {df.memory_usage(deep=True).sum() / 1024**2:.2f} MB')
        "

  model-validation:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install scikit-learn pandas joblib numpy
    
    - name: Validate model performance
      run: |
        python -c "
        import joblib
        import json
        import sys
        from pathlib import Path
        
        # Check if model exists
        model_path = Path('models/final/model.pkl')
        if not model_path.exists():
            print('⚠️  Warning: Final model not found, skipping validation')
            sys.exit(0)
        
        # Load model
        model = joblib.load(model_path)
        print(f'✅ Model loaded: {type(model).__name__}')
        
        # Validate model has required methods
        required_methods = ['predict', 'predict_proba']
        for method in required_methods:
            if not hasattr(model, method):
                print(f'❌ Error: Model missing required method: {method}')
                sys.exit(1)
        
        # Load features
        with open('src/selected_features.json', 'r') as f:
            features = json.load(f)
        
        print(f'✅ Model expects {len(features)} features')
        print('✅ Model validation passed')
        "
    
    - name: Check model performance threshold
      run: |
        python -c "
        import json
        import sys
        from pathlib import Path
        
        # Check if best_params.json exists
        params_path = Path('models/best_params.json')
        if not params_path.exists():
            print('⚠️  Warning: best_params.json not found')
            sys.exit(0)
        
        with open(params_path, 'r') as f:
            params = json.load(f)
        
        # Validate ROC-AUC threshold
        roc_auc = params.get('best_score', 0)
        threshold = 0.95
        
        print(f'Model ROC-AUC: {roc_auc:.4f}')
        print(f'Threshold: {threshold:.4f}')
        
        if roc_auc < threshold:
            print(f'⚠️  Warning: Model ROC-AUC ({roc_auc:.4f}) below threshold ({threshold:.4f})')
        else:
            print(f'✅ Model performance meets requirements')
        "

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  notify-success:
    runs-on: ubuntu-latest
    needs: [test, data-validation, model-validation, security-scan]
    if: success()
    
    steps:
    - name: Send Slack notification
      if: secrets.SLACK_WEBHOOK_URL != ''
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {
            "text": "✅ CI Pipeline Passed",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Diabetes Prediction MLOps* - CI Pipeline Passed ✅\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
      continue-on-error: true
